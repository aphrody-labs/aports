# Aphrody Alpine: sysctls for Bun (Bun.serve, fetch/HTTP/3, fs.watch, JSC/mimalloc) and containers.
# Applied at boot by the openrc sysctl service and at install by the post-install script.
# Keys that do not exist on the running kernel are ignored by the post-install (sysctl -e).

# ---- network: BBR + fq (kernel linux-aphrody has both built in) ----
# fq pacing is required by BBR.
net.core.default_qdisc = fq
# BBR congestion control: better throughput on lossy / long-fat links.
net.ipv4.tcp_congestion_control = bbr
# TCP Fast Open for client (1) and server (2): saves one RTT per connection.
net.ipv4.tcp_fastopen = 3
# Larger accept queue for busy servers (bun serve, proxies, CI).
net.core.somaxconn = 8192
# Packet queue per CPU before the stack; avoids drops on bursts.
net.core.netdev_max_backlog = 16384
# Maximum socket buffers (16 MiB): QUIC/HTTP/3 (lsquic) UDP sockets and high bandwidth-delay links.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
# TCP autotuning: min / default / max (max 16 MiB).
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
# Wide ephemeral port range for many outgoing connections (crawlers, tests, proxies).
net.ipv4.ip_local_port_range = 10240 65535
# Reuse TIME_WAIT sockets for outgoing connections (safe with timestamps).
net.ipv4.tcp_tw_reuse = 1
# Probe path MTU when ICMP is blackholed (VPN, overlay networks, containers).
net.ipv4.tcp_mtu_probing = 1
# Forward packets between interfaces: containers and VMs need it.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
# Bridge filtering sysctls (net.bridge.bridge-nf-call-*) only exist once br_netfilter is
# loaded (see /etc/modules-load.d/aphrody.conf); container engines set them themselves.

# ---- memory ----
# zram swap is compressed RAM: swapping is cheaper than dropping page cache, so a high value
# (kernel accepts up to 200) is right. Lower it on machines without zram.
vm.swappiness = 150
# No readahead of swap clusters: zram and fast disks do not benefit, saves latency.
vm.page-cluster = 0
# Keep dentry/inode cache longer (node_modules trees, bundlers, git).
vm.vfs_cache_pressure = 50
# Large mapping count: JSC heaps and mimalloc segments, Elasticsearch, sanitizer builds, many mmap files.
vm.max_map_count = 1048576
# Always grant mmap reservations: JSC reserves large virtual ranges (Gigacage, JIT, heap) up front.
vm.overcommit_memory = 1
# Start writeback earlier and cap dirty pages: smoother IO, shorter stalls on fsync.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15

# ---- filesystem ----
# bun --watch, bundlers and editors watch whole trees (node_modules): raise inotify limits.
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 1024
# System-wide and per-process file descriptor ceilings.
fs.file-max = 2097152
fs.nr_open = 1048576

# ---- kernel ----
# User namespaces: rootless containers, bubblewrap, sandboxes.
user.max_user_namespaces = 262144
# kernel.unprivileged_userns_clone only exists on Debian-style patched kernels; Alpine/linux-aphrody
# has none (user namespaces are always unprivileged), so the key is deliberately not set.
# Perf events for non-root (1: user-space and kernel profiling of own processes, no raw tracepoints).
kernel.perf_event_paranoid = 1
# Hide kernel pointers from users without CAP_SYSLOG (perf/bpftrace as root still work).
kernel.kptr_restrict = 1
# io_uring enabled for everyone (0); 1 would restrict to a group, 2 disable it.
kernel.io_uring_disabled = 0
# Many PIDs/threads for parallel CI and containers.
kernel.pid_max = 4194304
