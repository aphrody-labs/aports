# Aphrody Alpine server profile (aphrody-sysctl-server): installed as
# /etc/sysctl.d/91-aphrody-server.conf, read after 90-aphrody-bun.conf, so it only
# holds what a production VPS (KVM/VirtIO, no zram, public network) needs on top of
# that file and of the linux-aphrody/linux-virt defaults. Source: the former section 1
# of aphrody tools/config/host/aphrody-os/VPS-TUNING.md, keeping only the values that
# differ. Kept from 90-aphrody-bun.conf on purpose: tcp_rmem default 131072 (current
# kernel default, above the old 87380), ip_local_port_range 10240-65535 (1024 would
# collide with service ports), inotify max_user_watches 1048576.

# ---- network ----
# Accept queues for Bun.serve/nginx under load (90: somaxconn 8192; kernel derives the SYN backlog from RAM).
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 16384
# Default socket buffers and ancillary buffer ceiling (kernel 212992 / 131072).
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.optmem_max = 2048576
# Release FIN_WAIT_2 sockets sooner (kernel 60 s).
net.ipv4.tcp_fin_timeout = 15
# Keep the congestion window of idle keep-alive connections (kernel 1).
net.ipv4.tcp_slow_start_after_idle = 0
# Anti-spoofing and no ICMP redirects on a public host (kernel 0 / 1 / 1).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# ---- memory: no zram on a VPS ----
# 90 sets 150 for zram swap; on disk swap prefer RAM.
vm.swappiness = 10
# Cap dirty pages lower than 90 (15) to avoid VirtIO writeback stalls.
vm.dirty_ratio = 10
# Headroom for atomic network allocations (kernel derives a smaller value from RAM).
vm.min_free_kbytes = 65536

# ---- filesystem ----
fs.inotify.max_user_instances = 8192
# Asynchronous IO contexts (kernel 65536).
fs.aio-max-nr = 1048576

# ---- hardening ----
# Hide kernel pointers from everyone (90: 1, root with CAP_SYSLOG can read them).
kernel.kptr_restrict = 2
# Constant blinding for every eBPF JIT program (kernel 0).
net.core.bpf_jit_harden = 2
# Unprivileged BPF off until reboot (CONFIG_BPF_UNPRIV_DEFAULT_OFF gives 2, which root can revert).
kernel.unprivileged_bpf_disabled = 1
