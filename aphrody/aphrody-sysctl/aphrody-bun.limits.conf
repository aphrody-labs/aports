# Aphrody Alpine: file descriptor limits for Bun (Bun.serve connections, bun install, fs.watch).
# Read by pam_limits (sudo-rs, login with linux-pam). Bun raises its soft limit to the hard one at
# startup, so the hard limit is the one that matters. OpenRC services: rc_ulimit="-n 1048576"
# in /etc/rc.conf or /etc/conf.d/<service>.
*       soft    nofile  1048576
*       hard    nofile  1048576
root    soft    nofile  1048576
root    hard    nofile  1048576
