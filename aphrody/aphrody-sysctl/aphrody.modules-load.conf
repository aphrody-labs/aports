# Aphrody Alpine: kernel modules loaded at boot (read by the openrc modules service).
# BBR congestion control (built in on linux-aphrody; loads the module on the stock lts kernel).
tcp_bbr
# fq qdisc, needed by BBR pacing on kernels where it is a module.
sch_fq
# Compressed RAM swap device (zram swap is configured by zram-init or the admin).
zram
# Container layers (docker, podman, buildkit).
overlay
# Bridged traffic visible to iptables/nftables (container networking, kube-proxy).
br_netfilter
