# Rust build settings of the Aphrody packages built by `publish.ts build @rust-base`,
# appended to /etc/abuild.conf of the build container. /usr/share/abuild/default.conf
# already exports codegen-units=1, lto=true (fat), opt-level=s and panic=abort for
# CARGO_PROFILE_RELEASE_*, and only /etc/abuild.conf comes after it, so these lines go here
# rather than into the docker environment. cargo-auditable is per APKBUILD (makedepends).
#
#   mold     linker of every Rust link (`-fuse-ld=mold`, gcc >= 12 driver). wild (0.8 in
#            3.24, pre-1.0, four arches) stays a developer tool in aphrody-rust-tools.
#   sccache  RUSTC_WRAPPER when SCCACHE_DIR is set (the CI job restores it from the
#            actions cache); dependency crates hit it, binaries are always relinked.
#   APHRODY_RUST_CPU=x86-64-v3   optimized flavor for local builds only: publish.ts
#            refuses it, the published repository must run on every CPU of its arch.

if command -v mold >/dev/null 2>&1; then
	export RUSTFLAGS="${RUSTFLAGS-} -C link-arg=-fuse-ld=mold"
fi
if [ -n "${APHRODY_RUST_CPU:-}" ]; then
	export RUSTFLAGS="${RUSTFLAGS-} -C target-cpu=$APHRODY_RUST_CPU"
fi
if [ -n "${SCCACHE_DIR:-}" ] && command -v sccache >/dev/null 2>&1; then
	export RUSTC_WRAPPER=sccache
fi
